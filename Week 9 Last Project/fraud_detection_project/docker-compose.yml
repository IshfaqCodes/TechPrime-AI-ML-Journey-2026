# Phase 14: run both services together.
#   docker compose up --build
# API        -> http://localhost:8000/docs
# Dashboard  -> http://localhost:8501
#
# Note: the two images each bundle their own copy of models/ (see
# Dockerfile.api / Dockerfile.dashboard), so there's no shared volume to
# wire up for a basic run. Mount models/ as a volume instead if you want
# to retrain and refresh both containers without rebuilding images.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
